name: CI and Deploy Web

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-web-production
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyC1-s5R4gzElq4D5NatWkcklF198fTEvRo' }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'padaytharpin-app.firebaseapp.com' }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'padaytharpin-app' }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'padaytharpin-app.firebasestorage.app' }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '304535507982' }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:304535507982:web:b960bdb0f2bc1652fb985f' }}
  VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || 'G-F7JE4SNWDC' }}
  VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
  VITE_FIREBASE_APP_CHECK_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_KEY }}
  VITE_USE_EMULATORS: 'false'
  ENFORCE_APP_CHECK: ${{ vars.ENFORCE_APP_CHECK || 'false' }}

jobs:
  quality:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json

      - name: Install Web and Admin dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix firebase/functions

      - name: Typecheck Web and Admin
        run: npm run typecheck

      - name: Lint Web and Admin
        run: npm run lint

      - name: Build Web and Admin
        run: npm run build:all

      - name: Build and lint Firebase Functions
        run: |
          npm run build --prefix firebase/functions
          npm run lint --prefix firebase/functions

      - name: Run Functions unit tests
        run: npm test --prefix firebase/functions

      - name: Compile Firestore and Storage rules in emulators
        working-directory: firebase
        run: npx firebase emulators:exec --only firestore,storage --project padaytharpin-app "echo rules-ok"

      - name: Upload Web build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload Admin build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          if-no-files-found: error
          retention-days: 1

  deployment-secrets:
    name: Verify production deployment credentials
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check required secrets without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || missing+=(FIREBASE_SERVICE_ACCOUNT)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing production deployment secrets: ${missing[*]}"
            exit 1
          fi

  deploy-backend:
    name: Deploy Firebase backend and rules
    if: github.event_name != 'pull_request'
    needs:
      - quality
      - deployment-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json

      - name: Install deployment dependencies
        run: |
          npm ci
          npm ci --prefix firebase/functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Functions, Firestore, and Storage
        working-directory: firebase
        run: npx firebase deploy --only functions,firestore:rules,firestore:indexes,storage --project padaytharpin-app --non-interactive

  deploy:
    name: Deploy marketplace-app Worker
    if: github.event_name != 'pull_request'
    needs:
      - quality
      - deployment-secrets
      - deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://marketplace-app.hidecard1500.workers.dev/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download verified Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.131.0'
          command: deploy

  deploy-admin:
    name: Deploy marketplace-admin Worker
    if: github.event_name != 'pull_request'
    needs:
      - quality
      - deployment-secrets
      - deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://marketplace-admin.hidecard1500.workers.dev/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download verified Admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin/dist

      - name: Deploy Admin to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.131.0'
          command: deploy --config admin-wrangler.jsonc
