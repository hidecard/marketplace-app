name: Hostinger deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  release-check:
    name: Build and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies for tests in CI
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare SQLite test database
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's#^DB_DATABASE=.*#DB_DATABASE=${{ github.workspace }}/backend/database/database.sqlite#' .env
      - name: Run Laravel tests
        working-directory: backend
        run: |
          php artisan migrate:fresh --force
          php artisan test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build Laravel frontend assets
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify release layout
        working-directory: backend
        run: |
          test -f public/index.php
          test -f public/.htaccess
          test -f vendor/autoload.php
          test -d public/build
          test ! -e public/.env
      - name: Upload release artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-release-${{ github.sha }}
          path: backend/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
