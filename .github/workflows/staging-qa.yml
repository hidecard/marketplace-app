name: Staging QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/staging-qa.yml'

permissions:
  contents: read

concurrency:
  group: staging-qa
  cancel-in-progress: false

jobs:
  smoke:
    name: Read-only staging smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate staging secrets
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          for name in STAGING_BASE_URL STAGING_TEST_EMAIL STAGING_TEST_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done
          [[ "$STAGING_BASE_URL" == https://* ]] || {
            echo 'STAGING_BASE_URL must use HTTPS.' >&2
            exit 1
          }

      - name: Run public and authenticated smoke checks
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
        run: bash backend/scripts/staging-smoke.sh
