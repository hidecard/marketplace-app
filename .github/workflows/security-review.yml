name: Release security review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency and release security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tracked-secret baseline
        run: bash backend/scripts/release-security-check.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Audit Composer dependencies
        working-directory: backend
        run: |
          composer validate --strict --no-check-publish
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer audit --locked --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Audit npm production dependencies
        working-directory: backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high --omit=dev
